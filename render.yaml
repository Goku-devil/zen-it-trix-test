services:
  - type: web
    name: zen-it-trix-api
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FOOD_ADMIN_USERNAME
        sync: false
      - key: FOOD_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_MINUTES
        value: "240"
