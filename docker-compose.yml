services:
  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: zen_it_trix
      MARIADB_USER: zen_it_trix_db
      MARIADB_PASSWORD: root
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
      - ./Backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:8080
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: zen_it_trix
      DB_USER: zen_it_trix_db
      DB_PASSWORD: root
      DB_CONNECTION_LIMIT: 5
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin@zen-ti-trix-2
      ADMIN_SESSION_MINUTES: 240
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./Frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  database_data:
